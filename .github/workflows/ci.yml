name: build and test

# Development happens on dev; the only workflow before this one watched a
# develop branch that does not exist, so nothing was ever checked.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-19]
        config: [release, asserts]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          if [ "${{ matrix.compiler }}" = "g++-14" ]; then
            sudo apt-get install -y g++-14
          else
            # 24.04 ships clang-18; the project needs 19, which the CMake
            # version guard enforces.
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 19
          fi

      # PSI_NATIVE_ARCH=OFF because a runner's CPU is not the machine anyone
      # measures on, and the portable path deserves to be exercised.
      - name: Configure
        run: |
          extra=""
          if [ "${{ matrix.config }}" = "asserts" ]; then
            extra="-DPSI_ASSERTS=ON"
          fi
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DPSI_NATIVE_ARCH=OFF \
            $extra

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run the examples
        run: ./example/run_examples.sh

  consume:
    name: consumable by another project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-14

      - name: Install and consume via find_package
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-14 -DPSI_NATIVE_ARCH=OFF \
            -DPSI_BUILD_BENCHMARKS=OFF -DPSI_BUILD_EXAMPLES=OFF \
            -DPSI_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --install build
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15)
          project(psi_consumer LANGUAGES CXX)
          find_package(PSI REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE PSI::PSI)
          EOF
          cat > /tmp/consumer/main.cpp <<'EOF'
          #include "psi/kd_tree.h"
          #include "psi/dependence/splitter.h"
          #include <cstdio>
          using point = psi::basic_point<long, 2>;
          using rule = psi::orthogonal_split_rule<psi::rotate_dim<point>,
                                                  psi::spatial_median<point>>;
          int main() {
                  parlay::sequence<point> pts(1000);
                  for (size_t i = 0; i < pts.size(); i++) {
                          long c[2] = {long(i % 31), long(i % 29)};
                          pts[i] = point(c);
                  }
                  psi::kd_tree<psi::tree_traits<point, rule>> t;
                  t.build(parlay::make_slice(pts));
                  std::printf("indexed %zu points\n", t.get_size());
                  return t.get_size() == pts.size() ? 0 : 1;
          }
          EOF
          cmake -S /tmp/consumer -B /tmp/cbuild -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build /tmp/cbuild
          /tmp/cbuild/app

  oracle:
    name: CGAL oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CGAL and Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libcgal-dev libboost-dev libtbb-dev g++-14

      # kd_ccp and p_ccp only exist with -DCGAL=ON, and their checks are
      # asserts, so they mean nothing without them.
      - name: Build the oracles
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-14 \
            -DCGAL=ON -DPSI_ASSERTS=ON -DPSI_NATIVE_ARCH=OFF
          cmake --build build -j "$(nproc)" --target kd_ccp p_ccp data_generator

      - name: Compare against CGAL on generated data
        run: |
          root=/tmp/psi-data
          for kind in uniform ss_varden; do
            varden=0
            [ "$kind" = ss_varden ] && varden=1
            for d in 2 3; do
              ./build/data_generator -p "$root/$kind" -n 20000 -d "$d" \
                -file_num 2 -varden "$varden" -seed "$d"
            done
            # the generator adds a kind level the script does not expect
            for sub in "$root/$kind"/*/; do
              mv "$sub"* "$root/$kind"/ && rmdir "$sub"
            done
          done
          cd script
          PSI_NODES=20000 ./checkCorrect.sh fast "$root" ../build

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    # Codecov verifies this job's OIDC token rather than a stored secret.
    # contents: read is not redundant -- naming any permission at all drops
    # the rest to none, and checkout needs it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # gcovr is pinned for the reason clang-format is: a runner image bump
      # should not move a reported number on its own.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          pip install "gcovr==8.6"

      # -O1, not the -O0 that DEBUG=ON gives on its own: gcov can attribute
      # nothing once -O3 inlines a header-only library into its callers, and
      # -O0 costs seven times the run for the same report. Counters are
      # atomic because every operation under test is parallel and racing
      # counters undercount. The asserts stay live, so validate() runs too.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DPSI_NATIVE_ARCH=OFF \
            -DPSI_BUILD_BENCHMARKS=OFF -DPSI_BUILD_EXAMPLES=OFF \
            -DDEBUG=ON -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g" \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # cpam and hilbert.hpp are left out for the reason they are exempt from
      # the warning policy: the project does not maintain them.
      - name: Report
        run: |
          gcovr --root . build --gcov-executable gcov-14 \
            --filter 'include/psi/' \
            --exclude 'include/psi/dependence/cpam/' \
            --exclude 'include/psi/dependence/space_filling_curve/hilbert\.hpp' \
            -j "$(nproc)" \
            --cobertura coverage.xml --cobertura-pretty \
            --txt -

      # A failed upload does not turn a passing build into a failing one.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned, and from pip rather than apt, so a runner image bump cannot
      # fail a review for reasons unrelated to it. The tree is a fixpoint
      # under 22.1.3 as well; the pin is for reproducibility, not because any
      # file needs a particular version.
      - name: Check formatting
        run: |
          pip install "clang-format==19.1.0"
          files=$(git ls-files \
            'include/psi/*.h' 'include/psi/*.hpp' \
            'include/baselines/*.h' 'include/baselines/*.hpp' \
            'include/baselines/*.cpp' \
            'tests/*.h' 'tests/*.cpp' 'example/*.h' 'example/*.cpp')
          clang-format --style=file --dry-run --Werror $files
